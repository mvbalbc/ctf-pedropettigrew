<VirtualHost *:80>
    ServerName pedropettigrew.thm
    DocumentRoot /var/www/html
    DirectoryIndex login.html

    # So responde ao hostname da sala (porta opcional).
    # Acesso por IP ou por qualquer outro Host recebe 404, obrigando
    # o jogador a adicionar "IP pedropettigrew.thm" no /etc/hosts.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^pedropettigrew\.thm(:[0-9]+)?$ [NC]
    RewriteRule ^ - [R=404,L]

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>