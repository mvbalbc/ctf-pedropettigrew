<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa do Maroto</title>
    <style>
        body {
            background-image: url(Mapa_Maroto.jpg);
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .login {
            background-color: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 400px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login h1 {
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        .campo-senha {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .botao {
            background-color: red;
            color: white;
            border: none;
            border-radius: 4px;
            width: 80%;
            height: 45px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .botao:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <form class="login" action="login.php" method="POST">
        <h1>Rato, qual é a sua senha?</h1>
        <!-- Dica para os Marotos: /Capa_da_invisibilidade.txt -->
        <p id="erro" style="display:none; color:#ff6b6b; margin:0 0 12px;">Senha incorreta. Tente novamente.</p>
        <input type="password" name="password" class="campo-senha" placeholder="Digite a senha..." required>
        <input type="submit" value="Juro solenemente não fazer nada de bom" class="botao">
    </form>

    <script>
        if (new URLSearchParams(window.location.search).has('erro')) {
            document.getElementById('erro').style.display = 'block';
        }
    </script>
</body>
</html>
